spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/blueops_db}
    username: ${SPRING_DATASOURCE_USERNAME:blueops_user}
    password: ${SPRING_DATASOURCE_PASSWORD:blueops_secure_password_replace_in_prod}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

blueops:
  opensearch:
    enabled: true
