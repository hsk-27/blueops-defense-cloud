spring:
  datasource:
    url: jdbc:h2:mem:blueops_dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: none

blueops:
  opensearch:
    enabled: false # Graceful fallback to embedded/mock search in dev/test when OpenSearch container is offline
