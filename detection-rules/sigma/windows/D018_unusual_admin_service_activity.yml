title: Unusual Administrative Service Activity
id: 5f1b1e90-0018-4e89-9a08-000000000018
status: test
description: Detects service creation via sc.exe or PowerShell New-Service pointing to staging or user directories.
references:
    - https://attack.mitre.org/techniques/T1569/002/
author: BlueOps Detection Engineering
date: 2026-11-01
tags:
    - attack.persistence
    - attack.t1569.002
logsource:
    category: process_creation
    product: windows
    service: sysmon
detection:
    selection:
        Image|endswith: '\sc.exe'
        CommandLine|contains:
            - ' create '
            - ' binPath= '
    suspicious_binpath:
        CommandLine|contains:
            - '\Temp\'
            - '\AppData\'
            - '\Users\Public\'
            - 'powershell'
            - 'cmd.exe'
    condition: selection and suspicious_binpath
falsepositives:
    - Custom in-house service deployments executed from user build directories
level: high
