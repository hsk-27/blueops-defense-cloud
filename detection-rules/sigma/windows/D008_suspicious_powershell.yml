title: Suspicious PowerShell Execution
id: 5f1b1e90-0008-4e89-9a08-000000000008
status: test
description: Detects suspicious PowerShell command line flags and invocation patterns including encoded commands, execution policy bypass, and memory download cradles.
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: BlueOps Detection Engineering
date: 2026-11-01
modified: 2026-11-01
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
    service: sysmon
detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_flags:
        CommandLine|contains:
            - ' -enc '
            - ' -EncodedCommand '
            - ' -ep bypass '
            - ' -ExecutionPolicy Bypass '
            - 'DownloadString('
            - 'IEX('
            - 'Invoke-Expression'
            - 'FromBase64String'
    condition: selection_image and selection_flags
falsepositives:
    - Legitimate administrative automation scripts that utilize base64 encoding
    - Enterprise software installers with encoded wrappers
level: high
