title: Security Event Log Clearing
id: 5f1b1e90-0013-4e89-9a08-000000000013
status: test
description: Detects attempts to clear Windows security, system, or operational event logs using wevtutil or PowerShell.
references:
    - https://attack.mitre.org/techniques/T1070/001/
author: BlueOps Detection Engineering
date: 2026-11-01
tags:
    - attack.defense_evasion
    - attack.t1070.001
logsource:
    category: process_creation
    product: windows
    service: sysmon
detection:
    selection_wevtutil:
        Image|endswith: '\wevtutil.exe'
        CommandLine|contains:
            - ' cl '
            - ' clear-log '
    selection_powershell:
        CommandLine|contains:
            - 'Clear-EventLog'
            - 'Remove-EventLog'
            - 'Limit-EventLog'
    condition: selection_wevtutil or selection_powershell
falsepositives:
    - Administrative image preparation (sysprep) or authorized log rotation maintenance
level: critical
