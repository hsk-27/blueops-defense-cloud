title: Unusual Parent-Child Process Relationship
id: 5f1b1e90-0009-4e89-9a08-000000000009
status: test
description: Detects Microsoft Office applications, Acrobat Reader, or web servers spawning shell interpreters (cmd.exe, powershell.exe, wscript.exe, cscript.exe).
references:
    - https://attack.mitre.org/techniques/T1059/
author: BlueOps Detection Engineering
date: 2026-11-01
tags:
    - attack.execution
    - attack.t1059
logsource:
    category: process_creation
    product: windows
    service: sysmon
detection:
    selection_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\outlook.exe'
            - '\AcroRd32.exe'
            - '\w3wp.exe'
            - '\httpd.exe'
    selection_child:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
    condition: selection_parent and selection_child
falsepositives:
    - Custom in-house Excel VBA macros calling shell interpreters for legitimate business reports
level: critical
