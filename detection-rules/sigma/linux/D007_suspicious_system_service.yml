title: Suspicious Systemd Service Creation
id: 5f1b1e90-0007-4e89-9a08-000000000007
status: test
description: Detects creation or modification of systemd service files located in /etc/systemd/system/ for persistence.
references:
    - https://attack.mitre.org/techniques/T1543/002/
author: BlueOps Detection Engineering
date: 2026-11-01
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1543.002
logsource:
    product: linux
    service: auditd
detection:
    selection:
        file.path|startswith:
            - '/etc/systemd/system/'
            - '/usr/lib/systemd/system/'
        file.name|endswith: '.service'
        event.action:
            - 'file_created'
            - 'file_modified'
    filter_packages:
        process.executable|endswith:
            - '/dpkg'
            - '/apt'
            - '/yum'
            - '/dnf'
    condition: selection and not filter_packages
falsepositives:
    - Legitimate system administrator manual service installation
level: medium
