title: Linux Password Spraying Attack
id: 5f1b1e90-0003-4e89-9a08-000000000003
status: test
description: Detects failed authentication attempts targeting multiple distinct user accounts from a common source IP address.
references:
    - https://attack.mitre.org/techniques/T1110/003/
author: BlueOps Detection Engineering
date: 2026-11-01
tags:
    - attack.credential_access
    - attack.t1110.003
logsource:
    product: linux
    service: auth
detection:
    selection:
        event.category: 'authentication'
        event.outcome: 'failure'
    timeframe: 10m
    condition: selection | count(user.name) by source.ip > 3
falsepositives:
    - Misconfigured LDAP synchronization scripts attempting multiple test accounts
level: high
