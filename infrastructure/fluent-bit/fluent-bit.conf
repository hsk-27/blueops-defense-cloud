[SERVICE]
    Flush         2
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    Storage.path  /fluent-bit/buffer
    Storage.sync  normal
    Storage.checksum off
    Storage.backlog.mem_limit 32M

# --- INPUT: TCP / Syslog Ingestion for Endpoints ---
[INPUT]
    Name        tcp
    Listen      0.0.0.0
    Port        5140
    Format      json
    Tag         endpoint.raw

# --- INPUT: Forward protocol for containerized agents ---
[INPUT]
    Name        forward
    Listen      0.0.0.0
    Port        24224
    Tag         forward.raw

# --- INPUT: Direct Tail for Suricata EVE JSON if mounted ---
[INPUT]
    Name             tail
    Path             /var/log/suricata/eve.json
    Parser           suricata_eve
    Tag              suricata.eve
    Storage.type     filesystem
    Mem_Buf_Limit    16MB
    Skip_Long_Lines  On
    Refresh_Interval 2

# --- FILTER: Collector Tagging Only (Normalization & Schema Applied Backend-Side) ---
[FILTER]
    Name         record_modifier
    Match        endpoint.raw
    Record       blueops.collector fluent-bit

[FILTER]
    Name         record_modifier
    Match        forward.raw
    Record       blueops.collector fluent-bit

[FILTER]
    Name         record_modifier
    Match        suricata.*
    Record       event.provider Suricata
    Record       event.dataset network.suricata
    Record       blueops.collector fluent-bit

# --- OUTPUT: Primary Authenticated BlueOps Backend Ingestion ---
[OUTPUT]
    Name            http
    Match           *
    Host            backend
    Port            8080
    URI             /api/v1/telemetry/ingest
    Format          json
    Header          Content-Type application/json
    Header          X-BlueOps-Ingest-Key ${BLUEOPS_INGEST_API_KEY}
    Retry_Limit     5

# --- OUTPUT: Raw OpenSearch Archival Ingestion ---
[OUTPUT]
    Name            opensearch
    Match           *
    Host            opensearch
    Port            9200
    Index           blueops-events
    Type            _doc
    Logstash_Format On
    Logstash_Prefix blueops-events
    Logstash_DateFormat %Y.%m.%d
    Time_Key        @timestamp
    Include_Tag_Key On
    Tag_Key         blueops.routing_tag
    Generate_ID     On
    Retry_Limit     5
    Buffer_Size     64KB
    Suppress_Type_Name On
